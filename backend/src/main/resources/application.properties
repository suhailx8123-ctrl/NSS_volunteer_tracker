spring.application.name=volunteering-tracker-backend
server.port=8080

# ============================================================================
# Supabase Cloud PostgreSQL JDBC (Pooler / Direct Connection)
# Set your environment variables: SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD
# or provide standard local / cloud database URL for testing
# ============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${SUPABASE_DB_USER:postgres.yourprojectref}
spring.datasource.password=${SUPABASE_DB_PASSWORD:yourpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pooler Tuning (Tuned specifically for Supabase pooler limits)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=SupabaseHikariPool

# JPA / Hibernate 6
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Security & Stateless JWT Constants
app.jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9}
app.jwt.expiration-ms=86400000
app.certificate.minimum-hours=60.0

# Client Application URL for CORS
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
